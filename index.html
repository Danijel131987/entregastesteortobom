<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EntregaFácil Ortobom - Painel Corporativo</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; padding-bottom: 40px; }
        header { background: linear-gradient(135deg, #0b1a3a 0%, #071127 100%); color: white; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-bottom: 1px solid rgba(30,58,138,0.3); }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; justify-content: space-between; align-items: center; gap: 16px; }
        @media(min-width: 640px) { .header-container { flex-direction: row; } }
        .logo-box { display: flex; align-items: center; gap: 12px; }
        .badge { background-color: #1e3a8a; color: white; font-weight: 800; padding: 6px 12px; border-radius: 8px; font-size: 14px; letter-spacing: 0.05em; border: 1px solid rgba(255,255,255,0.1); }
        .logo-title { font-size: 20px; font-weight: 900; color: white; }
        .logo-sub { font-size: 12px; color: #93c5fd; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-conexao { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 20px; background-color: rgba(22, 101, 52, 0.2); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.4); }
        .status-ponto { width: 8px; height: 8px; background-color: #4ade80; border-radius: 50%; box-shadow: 0 0 8px #4ade80; }
        .btn-admin { background-color: #0f172a; color: #e2e8f0; padding: 10px 20px; border-radius: 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; border: 1px solid #1e293b; cursor: pointer; }
        main { max-width: 1200px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 32px; }
        @media(min-width: 768px) { main { padding: 32px; } }
        .topo-calendario { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
        .grade-cal { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media(min-width: 480px) { .grade-cal { grid-template-columns: repeat(3, 1fr); } }
        @media(min-width: 768px) { .grade-cal { grid-template-columns: repeat(5, 1fr); } }
        .card-dia { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .card-dia:hover { border-color: #1e3a8a; transform: translateY(-2px); }
        .card-dia.selecionado { border-color: #1e3a8a; background-color: #eff6ff; box-shadow: 0 0 0 3px rgba(30,58,138,0.15); }
        .dia-semana { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
        .dia-numero { font-size: 24px; font-weight: 900; color: #0f172a; margin: 4px 0; }
        .dia-vagas { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 9999px; display: inline-block; }
        .vagas-ok { background-color: #f0fdf4; color: #166534; }
        .vagas-esgotado { background-color: #fef2f2; color: #991b1b; }
        .layout-conteudo { display: grid; grid-template-columns: 1fr; gap: 32px; align-items: start; }
        @media(min-width: 1024px) { .layout-conteudo { grid-template-columns: 1fr 2fr; } }
        .secao-box { background: white; padding: 24px; border-radius: 16px; border: 1px solid #f1f5f9; }
        .secao-titulo { font-size: 16px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .icon-bg { padding: 6px; background-color: #f0fdf4; color: #166534; border-radius: 8px; font-size: 14px; }
        .secao-titulo .icon-bg.azul { background-color: #dbeafe; color: #1e3a8a; }
        .form-grupo { margin-bottom: 20px; }
        .form-label { display: block; font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 8px; }
        .form-input { width: 100%; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; font-size: 14px; outline: none; background-color: #f8fafc; }
        .form-input:focus { border-color: #1e3a8a; background-color: white; }
        .busca-container { margin-bottom: 20px; width: 100%; }
        .busca-input { width: 100%; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 16px 12px 40px; font-size: 14px; outline: none; background: #ffffff url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' fill='none' viewBox='0 0 24 24' stroke='%2364748b'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z'/%3E%3C/svg%3E") no-repeat 14px center; background-size: 18px; }
        .btn-salvar { width: 100%; background-color: #1e3a8a; color: white; font-weight: 700; padding: 14px; border-radius: 12px; border: none; cursor: pointer; font-size: 14px; }
        .btn-salvar:hover { background-color: #172554; }
        
        /* BOTÕES DE AÇÃO NA TABELA */
        .btn-pdf { background-color: #dbeafe; color: #1e3a8a; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        .btn-pdf:hover { background-color: #bfdbfe; }
        
        /* BOTÃO DO "X" VERMELHO PARA DELETAR */
        .btn-deletar-x { background-color: #fef2f2; color: #dc2626; border: 1px solid #fee2e2; width: 32px; height: 32px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .btn-deletar-x:hover { background-color: #dc2626; color: white; border-color: #dc2626; }

        .tabela-wrapper { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-conteudo { background: white; padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; position: relative; }
        .fechar-modal { position: absolute; top: 16px; right: 16px; font-size: 20px; cursor: pointer; font-weight: bold; color: #64748b; }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="header-container">
            <div class="logo-box">
                <div class="badge">ORTOBOM</div>
                <div>
                    <h1 class="logo-title">EntregaFácil</h1>
                    <p class="logo-sub">Painel de Logística Diária</p>
                </div>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="status-conexao">
                    <div class="status-ponto"></div>
                    <span>Supabase Conectado</span>
                </div>
                <button class="btn-admin" onclick="abrirModalAdmin()">🔒 Configurar Vagas (ADM)</button>
            </div>
        </div>
    </header>

    <main>
        <!-- GRADE DE CALENDÁRIO -->
        <section class="secao-box">
            <div class="topo-calendario">
                <h2 class="secao-titulo"><span class="icon-bg azul">📅</span> Grade de Vagas Disponíveis (Próximos 10 Dias)</h2>
            </div>
            <div class="grade-cal" id="grade-calendario">
                <!-- Inserido dinamicamente via JS -->
            </div>
        </section>

        <div class="layout-conteudo">
            <!-- FORMULÁRIO DE NOVA ENTREGA COM CAMPO PDF -->
            <section class="secao-box">
                <h2 class="secao-titulo"><span class="icon-bg">＋</span> Nova Entrega</h2>
                <form id="form-entrega" onsubmit="salvarAgendamento(event)">
                    <div class="form-grupo">
                        <label class="form-label">Data de entrega *</label>
                        <input type="date" id="form-data" class="form-input" required readonly>
                    </div>
                    <div class="form-grupo">
                        <label class="form-label">CPF do Cliente *</label>
                        <input type="text" id="form-cpf" class="form-input" placeholder="000.000.000-00" required>
                    </div>
                    <div class="form-grupo">
                        <label class="form-label">Nome completo *</label>
                        <input type="text" id="form-nome" class="form-input" placeholder="Nome do Cliente" required>
                    </div>
                    <div class="form-grupo">
                        <label class="form-label">Comprovante (PDF) *</label>
                        <input type="file" id="form-pdf" class="form-input" accept="application/pdf" required>
                    </div>
                    <button type="submit" class="btn-salvar">💾 Salvar Agendamento</button>
                </form>
            </section>
            <!-- TABELA DE RESUMO COM COLUNAS PARA PDF E EXCLUSÃO -->
            <section class="secao-box">
                <h2 class="secao-titulo"><span class="icon-bg azul">📋</span> Resumo Geral das Entregas Cadastradas</h2>
                <div class="busca-container">
                    <input type="text" id="busca-tabela" class="busca-input" placeholder="Buscar por CPF ou Nome..." oninput="filtrarTabela()">
                </div>
                <div class="tabela-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Cliente</th>
                                <th>CPF</th>
                                <th>Documento</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-tabela">
                            <!-- Inserido dinamicamente via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- MODAL CONFIGURAÇÃO ADM -->
    <div id="modal-admin" class="modal">
        <div class="modal-conteudo">
            <span class="fechar-modal" onclick="fecharModalAdmin()">&times;</span>
            <h3 style="margin-bottom: 20px; font-size: 16px;">🛡 Configuração de Vagas (ADM)</h3>
            <div class="form-grupo">
                <label class="form-label">Selecionar Data</label>
                <input type="date" id="admin-data" class="form-input">
            </div>
            <div class="form-grupo">
                <label class="form-label">Novo Limite de Vagas</label>
                <input type="number" id="admin-limite" class="form-input" value="10">
            </div>
            <button class="btn-salvar" onclick="atualizarLimiteData()">Atualizar Limite da Data</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO DA CONEXÃO DO SUPABASE
        // ==========================================
        const SUPABASE_URL = "https://ocbpnzupqrurjworyabq.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_4uvYbyTG0dspsavRX2BB2Q_dVkpyXfB"; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let dataSelecionada = "";
        let listaEntregas = [];
        let limitesVagasPersonalizados = {}; 
        const LIMITE_PADRAO = 10; 

        document.addEventListener("DOMContentLoaded", () => {
            configurarProximosDias();
            carregarDadosDoSupabase();
        });
        // CONFIGURA DINAMICAMENTE OS CARDS DOS PRÓXIMOS 10 DIAS
        function configurarProximosDias() {
            const grade = document.getElementById("grade-calendario");
            grade.innerHTML = "";
            const diasSemana = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
            
            const hoje = new Date();
            
            for (let i = 0; i < 10; i++) {
                const dataFutura = new Date(hoje);
                dataFutura.setDate(hoje.getDate() + i);
                
                const dataFormatadaISO = dataFutura.toISOString().split('T')[0];
                const diaNumero = dataFutura.getDate();
                const diaSemanaTexto = diasSemana[dataFutura.getDay()];
                
                const card = document.createElement("div");
                card.className = "card-dia";
                card.setAttribute("id", `card-${dataFormatadaISO}`);
                card.setAttribute("data-date", dataFormatadaISO);
                card.onclick = () => selecionarData(dataFormatadaISO);
                
                card.innerHTML = `
                    <div class="dia-semana">${diaSemanaTexto}</div>
                    <div class="dia-numero">${diaNumero}</div>
                    <div class="dia-vagas vagas-ok" id="vagas-txt-${dataFormatadaISO}">Calculando...</div>
                `;
                
                grade.appendChild(card);
                
                if (i === 0) {
                    selecionarData(dataFormatadaISO);
                }
            }
        }

        // SELECIONA UMA DATA ESPECÍFICA NA GRADE
        function selecionarData(dataStr) {
            dataSelecionada = dataStr;
            document.getElementById("form-data").value = dataStr;
            
            document.querySelectorAll(".card-dia").forEach(card => card.classList.remove("selecionado"));
            const cardAlvo = document.getElementById(`card-${dataStr}`);
            if (cardAlvo) cardAlvo.classList.add("selecionado");
        }

        // BUSCA TODOS OS DADOS REALIZADOS DIRETAMENTE NO SUPABASE
        async function carregarDadosDoSupabase() {
            try {
                const { data: agendamentos, error: errAgendamentos } = await supabaseClient
                    .from('agendamentos')
                    .select('*')
                    .order('data_entrega', { ascending: true });

                if (errAgendamentos) throw errAgendamentos;
                listaEntregas = agendamentos || [];

                const { data: limites, error: errLimites } = await supabaseClient
                    .from('config_vagas')
                    .select('*');

                if (!errLimites && limites) {
                    limitesVagasPersonalizados = {};
                    limites.forEach(l => {
                        limitesVagasPersonalizados[l.data_custom] = l.limite;
                    });
                }

                atualizarInterface();
            } catch (error) {
                console.error("Erro ao carregar dados:", error.message);
            }
        }
        // ATUALIZA OS CONTADORES VISUAIS DA TELA COM OS DADOS DO BANCO
        function atualizarInterface() {
            document.querySelectorAll(".card-dia").forEach(card => {
                const dataCard = card.getAttribute("data-date");
                const totalAgendado = listaEntregas.filter(e => e.data_entrega === dataCard).length;
                const limiteMaximo = limitesVagasPersonalizados[dataCard] !== undefined ? limitesVagasPersonalizados[dataCard] : LIMITE_PADRAO;
                const vagasRestantes = Math.max(0, limiteMaximo - totalAgendado);
                
                const txtVagas = document.getElementById(`vagas-txt-${dataCard}`);
                if (txtVagas) {
                    if (vagasRestantes === 0) {
                        txtVagas.innerText = "Esgotado";
                        txtVagas.className = "dia-vagas vagas-esgotado";
                    } else {
                        txtVagas.innerText = `${vagasRestantes} vagas restantes`;
                        txtVagas.className = "dia-vagas vagas-ok";
                    }
                }
            });

            renderizarTabela(listaEntregas);
        }

        // RENDERIZA AS LINHAS DA TABELA DE RESUMO GERAL COM O BOTÃO X
        function renderizarTabela(dados) {
            const corpo = document.getElementById("corpo-tabela");
            corpo.innerHTML = "";
            
            if (dados.length === 0) {
                corpo.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">Nenhum agendamento encontrado</td></tr>`;
                return;
            }

            dados.forEach(item => {
                const partes = item.data_entrega.split("-");
                const dataExibicao = `${partes[2]}/${partes[1]}/${partes[0]}`;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><span class="link-data-clicavel" onclick="selecionarData('${item.data_entrega}')">${dataExibicao}</span></td>
                    <td><strong>${item.nome_cliente}</strong></td>
                    <td>${item.cpf_cliente}</td>
                    <td>
                        <a href="${item.url_comprovante}" target="_blank" class="btn-pdf">📄 Ver PDF</a>
                    </td>
                    <td>
                        <button class="btn-deletar-x" title="Excluir Entrega" onclick="deletarAgendamento(${item.id}, '${item.nome_comprovante}')">✕</button>
                    </td>
                `;
                corpo.appendChild(tr);
            });
        }

        // FILTRO EM TEMPO REAL NA BUSCA DA TABELA
        function filtrarTabela() {
            const termo = document.getElementById("busca-tabela").value.toLowerCase();
            const filtrados = listaEntregas.filter(e => 
                e.nome_cliente.toLowerCase().includes(termo) || 
                e.cpf_cliente.includes(termo)
            );
            renderizarTabela(filtrados);
        }
        // INSERE UM NOVO AGENDAMENTO E FAZ O UPLOAD DO PDF NO STORAGE
        async function salvarAgendamento(event) {
            event.preventDefault();

            const cpf = document.getElementById("form-cpf").value;
            const nome = document.getElementById("form-nome").value;
            const arquivoPdfInput = document.getElementById("form-pdf");
            const arquivos = arquivoPdfInput.files;

            const totalAgendado = listaEntregas.filter(e => e.data_entrega === dataSelecionada).length;
            const limiteMaximo = limitesVagasPersonalizados[dataSelecionada] !== undefined ? limitesVagasPersonalizados[dataSelecionada] : LIMITE_PADRAO;
            
            if (totalAgendado >= limiteMaximo) {
                alert("Desculpe! As vagas para este dia foram esgotadas no momento.");
                return;
            }

            if (arquivos.length === 0) {
                alert("Por favor, selecione o comprovante em formato PDF.");
                return;
            }

            const arquivo = arquivos[0];

            try {
                // 1. Gerar um nome único para o arquivo não sobrescrever outros
                const nomeArquivoUnico = `${Date.now()}_${arquivo.name}`;

                // 2. Fazer o upload do PDF para a pasta 'comprovantes' no Storage do Supabase
                const { error: errorUpload } = await supabaseClient
                    .storage
                    .from('comprovantes')
                    .upload(nomeArquivoUnico, arquivo);

                if (errorUpload) throw errorUpload;

                // 3. Pegar a URL pública gerada para abrir o PDF depois
                const { data: dataUrl } = supabaseClient
                    .storage
                    .from('comprovantes')
                    .getPublicUrl(nomeArquivoUnico);

                const urlPublica = dataUrl.publicUrl;

                // 4. Salvar as informações na tabela do banco de dados
                const { error: errorBanco } = await supabaseClient
                    .from('agendamentos')
                    .insert([{ 
                        data_entrega: dataSelecionada, 
                        cpf_cliente: cpf, 
                        nome_cliente: nome,
                        url_comprovante: urlPublica,
                        nome_comprovante: nomeArquivoUnico
                    }]);

                if (errorBanco) throw errorBanco;

                alert("Agendamento e PDF salvos com sucesso!");
                document.getElementById("form-cpf").value = "";
                document.getElementById("form-nome").value = "";
                arquivoPdfInput.value = "";
                
                carregarDadosDoSupabase();
            } catch (error) {
                console.error("Erro ao salvar agendamento:", error.message);
                alert("Erro ao salvar: " + error.message);
            }
        }

        // FUNÇÃO DE EXCLUSÃO: APAGA A ENTREGA E O ARQUIVO PDF DO STORAGE E DO BANCO
        async function deletarAgendamento(idAgendamento, nomeArquivo) {
            if (!confirm("Tem certeza que deseja excluir permanentemente este agendamento?")) {
                return;
            }

            try {
                // 1. Apaga o registro da tabela de entregas
                const { error: errorTabela } = await supabaseClient
                    .from('agendamentos')
                    .delete()
                    .eq('id', idAgendamento);

                if (errorTabela) throw errorTabela;

                // 2. Apaga o arquivo físico de PDF guardado no Storage para não ocupar espaço à toa
                if (nomeArquivo && nomeArquivo !== 'undefined' && nomeArquivo !== 'null') {
                    await supabaseClient
                        .storage
                        .from('comprovantes')
                        .remove([nomeArquivo]);
                }

                alert("Agendamento excluído com sucesso!");
                carregarDadosDoSupabase();
            } catch (error) {
                console.error("Erro ao deletar:", error.message);
                alert("Erro ao excluir agendamento: " + error.message);
            }
        }
        // SALVA OU ATUALIZA O LIMITE DE VAGAS VIA PAINEL ADM
        async function atualizarLimiteData() {
            const dataDefinida = document.getElementById("admin-data").value;
            const novoLimite = parseInt(document.getElementById("admin-limite").value);

            if (!dataDefinida || isNaN(novoLimite)) {
                alert("Por favor, preencha todos os campos do painel ADM.");
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('config_vagas')
                    .upsert({ data_custom: dataDefinida, limite: novoLimite }, { onConflict: 'data_custom' });

                if (error) throw error;

                alert(`Limite da data alterado para ${novoLimite} vagas!`);
                fecharModalAdmin();
                carregarDadosDoSupabase();
            } catch (error) {
                console.error("Erro ao definir limite ADM:", error.message);
                alert("Erro ao salvar limite: " + error.message);
            }
        }

        // CONTROLES DE ABERTURA E FECHAMENTO DO MODAL
        function abrirModalAdmin() {
            document.getElementById("modal-admin").style.display = "flex";
            document.getElementById("admin-data").value = dataSelecionada;
        }
        function fecharModalAdmin() {
            document.getElementById("modal-admin").style.display = "none";
        }
    </script>
</body>
</html>
